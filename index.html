<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards de Biología Celular</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:#eef4f8}
.container{width:min(92vw,600px);text-align:center}
.scene{width:100%;height:380px;perspective:1000px;margin:15px 0}
.card{width:100%;height:100%;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .7s}
.scene.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:white;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.16);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:38px;text-align:center}
.back{transform:rotateY(180deg)}
h1{color:#243447}.question{font-size:27px;font-weight:bold}.answer{font-size:19px;line-height:1.6;color:#34495e}.label{font-weight:bold;color:#1f618d}.hint{margin-top:25px;font-size:14px;color:#7f8c8d}
.controls{display:flex;justify-content:center;gap:12px;align-items:center}button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer;background:#2c3e50;color:white}button:disabled{opacity:.4}#counter{font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>🧬 Flashcards de Biología Celular</h1>
<div class="scene" id="scene"><div class="card">
<div class="face front"><div id="question" class="question"></div><div class="hint">Haz clic para ver la respuesta ↻</div></div>
<div class="face back"><div class="label" style="font-size:25px;margin-bottom:20px">💡 Respuesta</div><div id="answer" class="answer"></div><div class="hint">Haz clic para volver ↻</div></div>
</div></div>
<div class="controls"><button id="prev">← Anterior</button><span id="counter">1 / 5</span><button id="next">Siguiente →</button></div>
</div>
<script>
const cards=[
["¿Qué función tiene el lisosoma?","Degrada desechos celulares, sustancias que ya no sirven y partes celulares dañadas. Contiene enzimas digestivas que descomponen estos materiales y ayudan a reciclar componentes de la célula."],
["¿Cuál es la función del núcleo celular?","Contiene el ADN y controla muchas actividades de la célula, como el crecimiento, el metabolismo y la reproducción."],
["¿Qué función tienen las mitocondrias?","Producen gran parte de la energía que necesita la célula en forma de ATP mediante la respiración celular."],
["¿Qué función cumple el retículo endoplasmático rugoso?","Participa en la producción y transporte de proteínas. Tiene ribosomas adheridos a su superficie."],
["¿Qué función tiene la membrana plasmática?","Rodea y protege la célula y controla qué sustancias entran y salen de ella."]
];
let current=0;
const scene=document.getElementById("scene"),q=document.getElementById("question"),a=document.getElementById("answer"),counter=document.getElementById("counter");
function showCard(){scene.classList.remove("flipped");q.textContent=cards[current][0];a.textContent=cards[current][1];counter.textContent=(current+1)+" / "+cards.length;document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===cards.length-1}
scene.onclick=()=>scene.classList.toggle("flipped");
document.getElementById("prev").onclick=()=>{if(current>0){current--;showCard()}};
document.getElementById("next").onclick=()=>{if(current<cards.length-1){current++;showCard()}};
showCard();
</script>
</body>
</html>
